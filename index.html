<meta name="theme-color" content="#0a1216">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* Tata letak: panel gelap dua kolom — bilah menu tetap di kiri, satu panel isi di kanan
   yang berganti menurut menu. Angka dan penanda persamaan memakai huruf monospasi. */
:root{
  --latar:#0b1418; --panel:#111e24; --panel2:#15262d; --naik:#19303a;
  --garis:#223b45; --garis2:#5e8894;
  --teks:#dce9ee; --teks2:#8ba5b0; --teks3:#5d7d89;
  --hijau:#2fe0a8; --hijau2:#15463c; --hijau3:#0f2e2a;
  --kuning:#f0c04a; --kuning2:#3b2f12;
  --merah:#f0837a; --merah2:#3a1f22;
  --kotak:#15262d; --kotak2:#122028; --terminal:#1d3a44; --perbaiki:#3a1f22; --olah:#142c2a; --putus:#1a2f38;
  --f:'IBM Plex Sans',system-ui,sans-serif; --m:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--latar);color:var(--teks);font-family:var(--f);line-height:1.6;
  min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#0a1216}

/* ---------------- bilah menu ---------------- */
aside{position:fixed;z-index:22;top:env(safe-area-inset-top,0px);left:0;width:240px;
  height:calc(100vh - env(safe-area-inset-top,0px));overflow:hidden;
  display:flex;flex-direction:column;
  background:#0a1216;border-right:1px solid var(--garis);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;padding-block:18px 28px}
.merek{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex:0 0 auto}
#menu{flex:1 1 auto;overflow-y:auto;min-height:0;
  scrollbar-width:thin;scrollbar-color:var(--garis2) transparent}
#menu::-webkit-scrollbar{width:6px}
#menu::-webkit-scrollbar-thumb{background:var(--garis2);border-radius:3px}
.logo{width:38px;height:38px;border-radius:9px;background:#f2f6f8;flex:0 0 auto;
  display:grid;place-items:center;padding:3px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.kaki{margin-top:22px;padding:12px 10px 0;border-top:1px solid var(--garis);flex:0 0 auto}
.kaki-teks{font:500 10px/1.6 var(--m);letter-spacing:.04em;color:var(--teks3);padding:0 2px}
#keluar{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:12px;
  font:600 11.5px var(--f);padding:9px 10px;border-radius:7px;cursor:pointer;
  background:transparent;border:1px solid var(--garis);color:var(--teks2);text-align:left}
#keluar:hover{border-color:var(--merah);color:var(--merah);background:#1a1012}
#keluar:focus-visible{outline:2px solid var(--hijau);outline-offset:2px}
#keluar svg{width:15px;height:15px;fill:currentColor;flex:0 0 auto}
.merek b{font:700 13px/1.2 var(--f);letter-spacing:.02em;display:block}
.merek span{font:500 10.5px/1.3 var(--m);color:var(--teks3);letter-spacing:.08em;text-transform:uppercase}
.grup{font:600 9.5px/1 var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--teks3);
  margin:18px 0 8px;padding-left:10px}
aside button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;color:var(--teks2);font:500 12.8px/1.3 var(--f);
  padding:8px 10px;border-radius:7px;cursor:pointer;margin-bottom:2px}
aside button:hover{background:#0f1d23;color:var(--teks)}
aside button.aktif{background:var(--hijau2);color:var(--hijau);font-weight:600}
aside button:focus-visible{outline:2px solid var(--hijau);outline-offset:1px}
aside button i{font-style:normal;font-family:var(--m);font-size:11px;color:var(--teks3);width:20px;flex:0 0 auto}
aside button.aktif i{color:var(--hijau)}

/* ---------------- isi ---------------- */
main{margin-left:240px;min-width:0;padding-block:0 56px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  max-width:1180px}
.kepala{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--latar);
  padding-block:20px 13px;margin-bottom:16px;border-bottom:1px solid var(--garis)}
.kepala h1{margin-bottom:0}
.eyebrow{font:600 10px/1 var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--hijau);margin-bottom:9px}
h1{font-size:clamp(1.35rem,3.1vw,1.85rem);line-height:1.14;margin:0 0 .4rem;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.lead{color:var(--teks2);max-width:70ch;margin:0 0 1.6rem;font-size:.93rem}
h2{font-size:1.05rem;margin:2rem 0 .7rem;font-weight:600}
h3{font-size:.95rem;margin:1.6rem 0 .5rem;font-weight:600}
p{margin:0 0 .8rem}
code{font-family:var(--m);font-size:.87em;background:var(--panel2);padding:.1em .35em;border-radius:3px}

/* ---------------- kartu persamaan ---------------- */
.kartu{background:var(--panel);border:1px solid var(--garis);border-radius:9px;margin-bottom:14px;overflow:hidden}
.kkepala{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:11px 14px;
  background:var(--panel2);border-bottom:1px solid var(--garis)}
.tag{font:700 10.5px/1 var(--m);color:var(--hijau);background:var(--hijau3);
  padding:5px 8px;border-radius:5px;letter-spacing:.03em;flex:0 0 auto}
.kkepala b{font-size:.92rem;font-weight:600;min-width:0}
.rumus{font-family:var(--m);font-size:clamp(.8rem,2.2vw,.96rem);font-weight:500;
  padding:15px 14px;overflow-x:auto;white-space:nowrap;color:#eaf6fa;
  background:linear-gradient(180deg,#0e1b21,#101e25);border-bottom:1px solid var(--garis)}
.rumus sub,.rumus sup{font-size:.72em}
/* pecahan bertingkat, penulisan matematis */
.frak{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
  line-height:1.2;margin:0 .22em;font-size:.94em}
.frak>span{padding:0 .36em;display:block}
.frak>span:first-child{border-bottom:1.3px solid currentColor;padding-bottom:.1em}
.frak>span:last-child{padding-top:.1em}
td .frak,.br .frak{font-size:.92em}
.notasi{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:1px 20px;
  padding:11px 14px 12px;border-bottom:1px solid var(--garis);background:#0c171d}
.notasi .judul{grid-column:1/-1;font:600 9.5px var(--m);letter-spacing:.14em;text-transform:uppercase;
  color:var(--teks3);margin-bottom:5px}
.notasi>div{display:flex;gap:10px;align-items:baseline;font-size:.82rem;padding:2.5px 0;min-width:0}
.notasi b{font-family:var(--m);font-size:.79rem;color:var(--hijau);font-weight:600;
  flex:0 0 auto;min-width:72px}
.notasi span{color:var(--teks2);min-width:0}
.sel4{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}
.sl{padding:12px 14px;border-top:1px solid var(--garis);border-right:1px solid var(--garis);min-width:0}
.sl h4{font:600 9.5px/1 var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--teks3);margin:0 0 7px}
.sl p{margin:0;font-size:.855rem;color:var(--teks)}
.hit{font-family:var(--m);font-size:.8rem;background:#0c171d;border:1px solid var(--garis);
  border-radius:5px;padding:8px 9px;margin-top:7px;white-space:normal;word-break:break-word;color:var(--hijau);line-height:1.7}

/* ---------------- nota ---------------- */
.nota{border-left:3px solid var(--hijau);background:var(--panel);padding:11px 14px;
  margin:14px 0;border-radius:0 7px 7px 0;font-size:.875rem}
.nota.awas{border-left-color:var(--kuning)}
.nota.bahaya{border-left-color:var(--merah)}
.nota b{font-weight:600;color:var(--teks)}
.nota>b:first-of-type{display:block;font:600 9.5px/1 var(--m);letter-spacing:.14em;text-transform:uppercase;
  color:var(--teks3);margin-bottom:6px}

/* ---------------- tabel ---------------- */
.tb{overflow-x:auto;border:1px solid var(--garis);border-radius:9px;background:var(--panel);margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--garis);white-space:nowrap}
th{font:600 9.5px/1.3 var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--teks3);background:#0d1a20}
td.n{font-family:var(--m);font-variant-numeric:tabular-nums;text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#13232a}
tr.sorot td{background:var(--kuning2)}
tr.sorot:hover td{background:#4a3a16}

/* ---------------- ubin angka ---------------- */
.ubin{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:14px 0}
.ub{background:var(--panel);border:1px solid var(--garis);border-radius:9px;padding:13px 14px;min-width:0}
.ub em{display:block;font:600 9.5px/1.3 var(--m);letter-spacing:.11em;text-transform:uppercase;
  color:var(--teks3);font-style:normal;margin-bottom:7px}
.ub strong{font-family:var(--m);font-size:1.5rem;font-weight:400;font-variant-numeric:tabular-nums;
  display:block;letter-spacing:-.01em}
.ub small{display:block;color:var(--teks2);font-size:.76rem;margin-top:4px}

/* ---------------- bagan alir ---------------- */
.alirbungkus{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:8px}
.alirkolom{background:var(--panel);border:1px solid var(--garis);border-radius:9px;padding:14px;min-width:0}
.alirkolom h3{margin:0 0 10px;font:600 10px/1 var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--hijau)}
.alirgeser{overflow-x:auto}
svg.alir{width:100%;min-width:430px;height:auto;display:block}
.alir .t{font:500 11.5px var(--f);fill:var(--teks)}
.alir .t-kecil{font:500 10.5px var(--f);fill:var(--teks)}
.alir .t-pers{font:600 10px var(--m);fill:var(--hijau)}
.alir .t-label{font:600 10px var(--m);fill:#8fb0ba}
.legenda{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 0;font-size:.78rem;color:var(--teks2)}
.legenda span{display:flex;align-items:center;gap:7px}
.sw{width:15px;height:13px;border-radius:3px;border:1px solid var(--garis);flex:0 0 auto}

/* ---------------- penanda sumber dan poin penting ---------------- */
.sum{margin:-6px 0 18px;padding:9px 12px;background:var(--panel2);border-left:3px solid var(--garis2);
  border-radius:0 6px 6px 0;font:500 .79rem/1.65 var(--m);color:var(--teks2);overflow-wrap:anywhere}
.sum span{display:inline-block;font:700 9px/1 var(--m);letter-spacing:.13em;color:var(--teks3);
  background:var(--kotak);padding:4px 7px;border-radius:3px;margin-right:9px;vertical-align:1px}
.sum code{background:var(--kotak);color:var(--teks)}
.pen{display:inline-block;font:700 9px/1 var(--m);letter-spacing:.13em;color:var(--latar);
  background:var(--kuning);padding:4px 7px;border-radius:3px;margin-right:8px;vertical-align:1px}
.nota.pentingnota{border-left-color:var(--kuning);background:var(--kuning2)}
tr.awasrow td{background:var(--perbaiki)}
tr.awasrow td:first-child{box-shadow:inset 3px 0 0 var(--merah)}

/* ---------------- blok kode ---------------- */
.kode{background:var(--terminal);border:1px solid var(--garis);border-radius:9px;margin:10px 0 14px;overflow:hidden}
.kode .judul{display:flex;align-items:center;gap:8px;padding:8px 13px;background:rgba(0,0,0,.22);border-bottom:1px solid var(--garis);font:600 10px/1 var(--m);letter-spacing:.11em;text-transform:uppercase;color:var(--hijau)}
.kode pre{margin:0;padding:13px;overflow-x:auto;font:400 12.3px/1.65 var(--m);color:var(--teks);white-space:pre}
.kode pre b{color:var(--hijau);font-weight:600}
.kode pre i{color:var(--teks3);font-style:normal}
.kode pre u{color:var(--kuning);text-decoration:none}
.kode + .ket{margin:-8px 0 14px;font-size:.84rem;color:var(--teks2)}
.kamus{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin:10px 0 18px}
.pers{background:var(--panel);border:1px solid var(--garis);border-radius:9px;padding:13px 14px;min-width:0}
.pers .no{font:700 10px/1 var(--m);letter-spacing:.07em;color:var(--hijau);background:var(--hijau3);padding:4px 7px;border-radius:4px;display:inline-block;margin-bottom:8px}
.pers .f{font:400 13px/1.85 var(--m);color:var(--teks);overflow-x:auto;padding:7px 9px;background:var(--kotak);border-radius:6px;margin:0 0 9px;white-space:pre-wrap;word-break:break-word}
.pers p{margin:0 0 7px;font-size:.855rem;line-height:1.6;color:var(--teks2)}
.pers p b{color:var(--teks);font-weight:600}
.pers .asal{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--garis);font:500 10.5px/1.5 var(--m);color:var(--teks3)}

/* ---------------- gambar / diagram ---------------- */
figure.gambar{background:var(--panel);border:1px solid var(--garis);border-radius:9px;padding:14px;margin:8px 0 14px;overflow-x:auto}
figure.gambar svg{width:100%;min-width:620px;height:auto;display:block}
figure.gambar .t{font:500 11.5px var(--f);fill:var(--teks)}
figure.gambar .t-kecil{font:500 10.5px var(--f);fill:var(--teks)}
figure.gambar .t-pers{font:600 10px var(--m);fill:var(--hijau)}
figure.gambar figcaption{margin:10px 0 0;font-size:.78rem;color:var(--teks2);text-align:center}

/* ---------------- iterasi ---------------- */
.iter{background:var(--panel);border:1px solid var(--garis);border-radius:9px;padding:14px;margin-bottom:12px}
.iterk{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lenc{font:700 10px/1 var(--m);padding:5px 8px;border-radius:5px;letter-spacing:.06em;flex:0 0 auto}
.lenc.ok{background:var(--hijau3);color:var(--hijau)}
.lenc.no{background:var(--merah2);color:var(--merah)}
.br{font-family:var(--m);font-size:.82rem;padding:6px 0;border-bottom:1px dashed var(--garis);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--teks2)}
.br:last-child{border-bottom:none}
.br b{color:var(--teks);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------------- latihan ---------------- */
.cip{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.cip button{font:600 11px/1 var(--m);padding:7px 11px;border-radius:999px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--garis);color:var(--teks2);letter-spacing:.03em}
.cip button:hover{border-color:var(--hijau);color:var(--teks)}
.cip button.aktif{background:var(--hijau2);border-color:var(--hijau);color:var(--hijau)}
.cip button:focus-visible{outline:2px solid var(--hijau);outline-offset:2px}

.soal{background:var(--panel);border:1px solid var(--garis);border-radius:11px;overflow:hidden}
.soalkepala{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--garis)}
.soalisi{padding:16px}
.pertanyaan{font-size:.95rem;margin-bottom:14px}
.diket{background:#0c171d;border:1px solid var(--garis);border-radius:7px;padding:11px 13px;margin-bottom:14px}
.diket div{font-family:var(--m);font-size:.84rem;display:flex;justify-content:space-between;gap:14px;
  padding:3px 0;color:var(--teks2);flex-wrap:wrap}
.diket div b{color:var(--hijau);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.jawabbaris{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.jawabbaris input{font-family:var(--m);font-size:1rem;padding:10px 12px;border-radius:7px;
  background:#0c171d;border:1px solid var(--garis);color:var(--teks);width:170px;min-width:0}
.jawabbaris input:focus{outline:2px solid var(--hijau);outline-offset:0;border-color:var(--hijau)}
.satuan{font-family:var(--m);font-size:.9rem;color:var(--teks2)}
button.aksi{font:600 12.5px var(--f);padding:10px 16px;border-radius:7px;cursor:pointer;
  background:var(--hijau);border:1px solid var(--hijau);color:#06201a}
button.aksi:hover{filter:brightness(1.08)}
button.aksi.sunyi{background:transparent;color:var(--teks2);border-color:var(--garis)}
button.aksi.sunyi:hover{color:var(--teks);border-color:var(--teks3);filter:none}
button.aksi:focus-visible{outline:2px solid var(--hijau);outline-offset:2px}
.umpan{margin-top:13px;padding:11px 13px;border-radius:7px;font-size:.875rem;display:none}
.umpan.tampil{display:block}
.umpan.benar{background:var(--hijau3);border:1px solid #1d5b4c;color:var(--hijau)}
.umpan.salah{background:var(--merah2);border:1px solid #5a2f2b;color:var(--merah)}
.langkah{margin-top:13px;display:none}
.langkah.tampil{display:block}
.langkah ol{margin:0;padding-left:20px}
.langkah li{font-family:var(--m);font-size:.82rem;color:var(--teks2);padding:4px 0}
.langkah li b{color:var(--teks)}
.skor{display:flex;gap:16px;font:600 11px var(--m);color:var(--teks2);letter-spacing:.04em;flex-wrap:wrap}
.skor b{color:var(--hijau);font-variant-numeric:tabular-nums}
.api{color:var(--kuning)}

.fin{color:var(--teks3);font-size:.8rem;margin-top:34px;border-top:1px solid var(--garis);padding-top:16px}

@media(max-width:820px){
  aside{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--garis);
    display:block;overflow:visible;padding-right:max(14px,env(safe-area-inset-right,0px))}
  #menu{overflow:visible;min-height:0}
  main{margin-left:0}
  .daftarmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px}
  .grup{display:none}
  .br b{white-space:normal;overflow-wrap:anywhere}
  .br span,.br code{overflow-wrap:anywhere;min-width:0}
  .kamus{grid-template-columns:1fr}
}

/* ---------------- catatan ala komentar Word ---------------- */
mark.ctt{background:var(--kuning2);color:inherit;border-bottom:2px solid var(--kuning);
  border-radius:2px;padding:1px 0;cursor:pointer}
mark.ctt:hover,mark.ctt.ctt-pilih{background:var(--kuning);color:var(--latar)}
sup.ctt-no{font:700 9px/1 var(--m);color:var(--latar);background:var(--kuning);
  border-radius:3px;padding:2px 4px;margin:0 2px;cursor:pointer;vertical-align:super;user-select:none}
sup.ctt-no:hover{filter:brightness(1.12)}

#ctt-tambah{position:fixed;z-index:60;display:none;align-items:center;gap:6px;
  font:600 11.5px var(--f);padding:7px 11px;border-radius:7px;cursor:pointer;
  background:var(--kuning);border:1px solid var(--kuning);color:var(--latar);
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
#ctt-tambah.tampil{display:inline-flex}
#ctt-tambah:hover{filter:brightness(1.1)}

#ctt-panel{position:fixed;z-index:58;top:0;right:0;width:340px;max-width:100vw;
  height:100vh;display:flex;flex-direction:column;background:#0a1216;
  border-left:1px solid var(--garis);box-shadow:-14px 0 34px rgba(0,0,0,.42);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-right:env(safe-area-inset-right,0px)}
#ctt-panel[hidden]{display:none}
.ctt-kepala{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:16px 16px 13px;border-bottom:1px solid var(--garis)}
.ctt-kepala b{font:700 12px var(--f);letter-spacing:.02em}
.ctt-kepala span{font:500 10px var(--m);color:var(--teks3);letter-spacing:.08em}
#ctt-tutup{background:none;border:0;color:var(--teks3);font-size:15px;cursor:pointer;
  padding:4px 7px;border-radius:5px;line-height:1}
#ctt-tutup:hover{background:var(--kotak);color:var(--teks)}
#ctt-isi{flex:1 1 auto;overflow-y:auto;min-height:0;padding:13px 14px 16px;
  scrollbar-width:thin;scrollbar-color:var(--garis2) transparent}
#ctt-isi::-webkit-scrollbar{width:6px}
#ctt-isi::-webkit-scrollbar-thumb{background:var(--garis2);border-radius:3px}

.ctt-grup{font:600 9px var(--m);letter-spacing:.14em;text-transform:uppercase;
  color:var(--teks3);margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--garis)}
.ctt-grup:first-child{margin-top:0}
.ctt-kartu{background:var(--panel);border:1px solid var(--garis);border-left:3px solid var(--kuning);
  border-radius:0 7px 7px 0;padding:10px 11px;margin-bottom:9px;cursor:pointer}
.ctt-kartu:hover{border-color:var(--garis2);border-left-color:var(--kuning)}
.ctt-kartu.lepas{border-left-color:var(--merah);opacity:.8}
.ctt-kartu .kut{font:500 10.5px/1.5 var(--m);color:var(--teks3);margin:0 0 6px;
  padding-left:8px;border-left:2px solid var(--garis2);overflow-wrap:anywhere}
.ctt-kartu .isi{font-size:.84rem;line-height:1.6;color:var(--teks);margin:0;
  white-space:pre-wrap;overflow-wrap:anywhere}
.ctt-kartu .meta{margin-top:7px;font:500 9.5px var(--m);color:var(--teks3);
  display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ctt-kartu .meta b{color:var(--merah);font-weight:700}
.ctt-kartu .alat{display:flex;gap:6px;margin-top:8px}
.ctt-kartu .alat button{font:600 10px var(--f);padding:5px 9px;border-radius:5px;cursor:pointer;
  background:var(--kotak);border:1px solid var(--garis);color:var(--teks2)}
.ctt-kartu .alat button:hover{color:var(--teks);border-color:var(--garis2)}
.ctt-kartu .alat button.hapus:hover{color:var(--merah);border-color:var(--merah)}

#ctt-isi textarea{width:100%;box-sizing:border-box;min-height:104px;resize:vertical;
  font:400 .85rem/1.6 var(--f);padding:10px 11px;border-radius:7px;
  background:#0c171d;border:1px solid var(--garis);color:var(--teks)}
#ctt-isi textarea:focus{outline:2px solid var(--kuning);border-color:var(--kuning)}
#ctt-isi textarea.kode{font:400 11px/1.55 var(--m);min-height:150px}
.ctt-aksi{display:flex;gap:7px;margin-top:9px}
.ctt-aksi button{flex:1 1 auto;font:600 11px var(--f);padding:8px;border-radius:6px;cursor:pointer;
  background:var(--kuning);border:1px solid var(--kuning);color:var(--latar)}
.ctt-aksi button.batal{background:var(--kotak);border-color:var(--garis);color:var(--teks2)}
.ctt-aksi button:hover{filter:brightness(1.08)}
.ctt-kosong{font-size:.84rem;line-height:1.65;color:var(--teks2);margin:0}
.ctt-kosong b{display:block;font:600 9.5px var(--m);letter-spacing:.14em;text-transform:uppercase;
  color:var(--teks3);margin-bottom:7px}
.ctt-kaki{flex:0 0 auto;display:flex;gap:7px;padding:11px 14px;border-top:1px solid var(--garis)}
.ctt-kaki button{flex:1 1 auto;font:600 10.5px var(--f);padding:8px;border-radius:6px;cursor:pointer;
  background:var(--kotak);border:1px solid var(--garis);color:var(--teks2)}
.ctt-kaki button:hover{color:var(--teks);border-color:var(--garis2)}
.ctt-ingat{margin:0 14px 12px;padding:9px 11px;border-radius:6px;background:var(--kuning2);
  border:1px solid var(--kuning);font:500 10.5px/1.55 var(--f);color:var(--teks)}

#ctt-buka{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;cursor:pointer;color:var(--teks2);
  font:500 12px var(--f);padding:9px 10px;border-radius:7px;margin-bottom:4px}
#ctt-buka:hover{background:#0f1d23;color:var(--teks)}
#ctt-buka svg{width:15px;height:15px;flex:0 0 auto;fill:currentColor}
#ctt-buka em{font-style:normal;margin-left:auto;font:700 10px var(--m);
  background:var(--kuning);color:var(--latar);border-radius:9px;padding:2px 7px}
#ctt-buka em:empty,#ctt-buka em.nol{display:none}

@media(max-width:820px){
  #ctt-panel{width:100%;border-left:0}
}
/* ---------------- tanya AI ---------------- */
.ctt-kut{font:500 10.5px/1.5 var(--m);color:var(--teks3);padding-left:8px;
  border-left:2px solid var(--garis2);margin:0 0 9px;overflow-wrap:anywhere}
.ctt-tanya{margin-top:14px;padding-top:12px;border-top:1px solid var(--garis)}
.ctt-tanya .lab{display:block;font:600 9px var(--m);letter-spacing:.14em;
  text-transform:uppercase;color:var(--teks3);margin-bottom:8px}
.ctt-ai{display:flex;gap:6px;flex-wrap:wrap}
.ctt-ai .ai{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--f);
  padding:7px 10px;border-radius:6px;cursor:pointer;text-decoration:none;
  background:var(--kotak);border:1px solid var(--garis);color:var(--teks2)}
.ctt-ai .ai:hover{color:var(--teks);border-color:var(--garis2)}
.ctt-ai .ai.claude{background:var(--hijau3);border-color:var(--hijau);color:var(--hijau)}
.ctt-ai .ai.claude:hover{background:var(--hijau);color:var(--latar)}
.ctt-ai .ai.mati{cursor:default;opacity:.55;border-style:dashed}
.ctt-ai .ai.mati:hover{color:var(--teks2);border-color:var(--garis)}
.ctt-anon{display:flex;align-items:flex-start;gap:7px;margin-top:10px;
  font:500 10.5px/1.5 var(--f);color:var(--teks2);cursor:pointer}
.ctt-anon input{margin:1px 0 0;accent-color:var(--kuning);flex:0 0 auto}
.ctt-cat{margin:9px 0 0;font:400 10px/1.55 var(--f);color:var(--teks3)}
.ctt-sisip{margin-top:11px;padding-top:11px;border-top:1px dashed var(--garis)}
.ctt-sisip textarea{width:100%;box-sizing:border-box;min-height:64px;resize:vertical;
  font:400 .82rem/1.55 var(--f);padding:9px 10px;border-radius:6px;
  background:#0c171d;border:1px solid var(--garis);color:var(--teks)}
.ctt-sisip textarea:focus{outline:2px solid var(--kuning);border-color:var(--kuning)}

.ctt-utas{margin:9px 0 0;display:flex;flex-direction:column;gap:7px}
.ctt-utas .bl{border-radius:7px;padding:8px 10px;font-size:.82rem;line-height:1.6;
  white-space:pre-wrap;overflow-wrap:anywhere}
.ctt-utas .bl .ke{display:block;font:600 8.5px var(--m);letter-spacing:.13em;
  text-transform:uppercase;margin-bottom:4px;opacity:.75}
.ctt-utas .bl.saya{background:var(--kotak);border:1px solid var(--garis);color:var(--teks2)}
.ctt-utas .bl.ai{background:var(--hijau3);border:1px solid var(--hijau);color:var(--teks)}
.ctt-utas .bl.ai .ke{color:var(--hijau)}
.ctt-utas .bl.ai.jalan .tx{opacity:.85}
.ctt-utas .bl .gl{display:block;margin-top:6px;font:600 10px var(--m);color:var(--merah)}
.ctt-tempel{align-self:flex-start;font:600 10px var(--f);padding:6px 10px;border-radius:6px;
  cursor:pointer;background:var(--kotak);border:1px dashed var(--garis2);color:var(--teks2)}
.ctt-tempel:hover{color:var(--teks);border-color:var(--kuning)}
.ctt-waspada{margin:0 0 11px;padding:10px 12px;border-radius:6px;background:var(--perbaiki);
  border:1px solid var(--merah);font:500 10.5px/1.6 var(--f);color:var(--teks)}
.ctt-waspada b{display:block;margin-bottom:4px;color:var(--merah);font-weight:700}
#ctt-isi input[type=password]{width:100%;box-sizing:border-box;font:400 11.5px var(--m);
  padding:10px 11px;border-radius:7px;background:#0c171d;border:1px solid var(--garis);color:var(--teks)}
#ctt-isi input[type=password]:focus{outline:2px solid var(--kuning);border-color:var(--kuning)}
.ctt-ai .ai.gemini{background:var(--biru2,rgba(96,165,250,.14));border-color:var(--biru,#60a5fa);
  color:var(--biru,#60a5fa)}
.ctt-ai .ai.gemini:hover{background:var(--biru,#60a5fa);color:var(--latar)}
.ctt-cat a{color:var(--kuning);text-decoration:underline;text-underline-offset:2px}

/* ---------------- tabel notasi gaya diktat ---------------- */
table.notl{width:100%;max-width:100%;border-collapse:collapse;margin:0 0 10px;table-layout:fixed}
table.notl caption{caption-side:top;text-align:left;font:600 8.5px var(--m);letter-spacing:.15em;
  text-transform:uppercase;color:var(--teks3);padding:0 0 6px}
table.notl td{box-sizing:border-box;padding:5px 8px 5px 0;border-bottom:1px solid var(--garis);
  vertical-align:top;font-size:.82rem;line-height:1.55;color:var(--teks2);
  white-space:normal;overflow-wrap:break-word}
table.notl tr:last-child td{border-bottom:0}
table.notl td.lb{font:600 11.5px/1.5 var(--m);color:var(--hijau);width:33%;
  padding-right:12px;overflow-wrap:anywhere}
table.notl td.st{font:500 9.5px/1.6 var(--m);color:var(--teks3);width:19%;
  text-align:right;padding-right:0;overflow-wrap:anywhere}
table.notl td b{color:var(--teks);font-weight:600}
.pers .f + table.notl{margin-top:2px}
.lambang td.lb{color:var(--kuning)}
.lambang td.pk{font:500 9.5px/1.6 var(--m);color:var(--teks3);white-space:nowrap;text-align:right}

/* kartu kamus dibuat lebih lebar supaya tabel notasi tidak sesak */
#p-kamus .kamus{grid-template-columns:repeat(auto-fit,minmax(430px,1fr))}
#p-kamus .pers{overflow:hidden}
@media(max-width:1000px){ #p-kamus .kamus{grid-template-columns:1fr} }

/* tabel daftar lambang: kolom nama ikut membungkus, dua kolom sempit tetap utuh */
table.lambang td{white-space:normal;vertical-align:top}
table.lambang td.lb,table.lambang td.pk{white-space:nowrap}

/* ---------------- cara membaca formula ---------------- */
ol.bacal{margin:11px 0 16px;padding:0;list-style:none;counter-reset:bl}
ol.bacal li{counter-increment:bl;position:relative;padding:0 0 12px 36px;
  font-size:.875rem;line-height:1.68;color:var(--teks2)}
ol.bacal li::before{content:counter(bl);position:absolute;left:0;top:0;width:23px;height:23px;
  border-radius:50%;background:var(--hijau3);color:var(--hijau);
  font:700 11px/23px var(--m);text-align:center}
ol.bacal li b{color:var(--teks);font-weight:600}
ol.bacal li:last-child{padding-bottom:0}

</style>

      kel.hidden = false;
      kel.addEventListener('click', function(){
        try { sessionStorage.removeItem('hc-kunci'); } catch(e){}
        location.reload();
      });
    }
  }

  document.getElementById('formkunci').addEventListener('submit', function(e){
    e.preventDefault();
    var frasa = inp.value;
    if (!frasa) { pesan.textContent = 'Frasa sandi belum diisi.'; return; }
    tb.disabled = true; tb.textContent = 'Membuka…'; pesan.textContent = '';
    buka(frasa).then(pasang).catch(function(){
      tb.disabled = false; tb.textContent = 'Buka panel';
      pesan.textContent = 'Frasa sandi salah.';
      inp.select();
    });
  });

  // buka sendiri bila masih dalam sesi peramban yang sama
  var simpan = null;
  try { simpan = sessionStorage.getItem('hc-kunci'); } catch(e){}
  if (simpan){ inp.value = simpan; buka(simpan).then(pasang).catch(function(){ inp.value=''; }); }
  else { inp.focus(); }
})();
</script>
