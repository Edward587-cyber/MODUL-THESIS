<meta name="claude:viewport-fit-sides" content="cover">
<title>Panel Bimbingan Hosting Capacity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* Tata letak: panel gelap dua kolom — bilah menu tetap di kiri, satu panel isi di kanan
   yang berganti menurut menu. Angka dan penanda persamaan memakai huruf monospasi. */
:root{
  --latar:#0b1418; --panel:#111e24; --panel2:#15262d; --naik:#19303a;
  --garis:#223b45; --garis2:#5e8894;
  --teks:#dce9ee; --teks2:#8ba5b0; --teks3:#5d7d89;
  --hijau:#2fe0a8; --hijau2:#15463c; --hijau3:#0f2e2a;
  --kuning:#f0c04a; --kuning2:#3b2f12;
  --merah:#f0837a; --merah2:#3a1f22;
  --kotak:#15262d; --kotak2:#122028; --terminal:#1d3a44; --perbaiki:#3a1f22; --olah:#142c2a; --putus:#1a2f38;
  --f:'IBM Plex Sans',system-ui,sans-serif; --m:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--latar);color:var(--teks);font-family:var(--f);line-height:1.6;
  min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#0a1216}

/* ---------------- bilah menu ---------------- */
aside{position:fixed;z-index:22;top:env(safe-area-inset-top,0px);left:0;width:240px;
  height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;
  background:#0a1216;border-right:1px solid var(--garis);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;padding-block:18px 28px}
.merek{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo{width:38px;height:38px;border-radius:9px;background:#f2f6f8;flex:0 0 auto;
  display:grid;place-items:center;padding:3px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.kaki{margin-top:22px;padding:12px 10px 0;border-top:1px solid var(--garis);
  font:500 10px/1.6 var(--m);letter-spacing:.04em;color:var(--teks3)}
.merek b{font:700 13px/1.2 var(--f);letter-spacing:.02em;display:block}
.merek span{font:500 10.5px/1.3 var(--m);color:var(--teks3);letter-spacing:.08em;text-transform:uppercase}
.grup{font:600 9.5px/1 var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--teks3);
  margin:18px 0 8px;padding-left:10px}
aside button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;color:var(--teks2);font:500 12.8px/1.3 var(--f);
  padding:8px 10px;border-radius:7px;cursor:pointer;margin-bottom:2px}
aside button:hover{background:#0f1d23;color:var(--teks)}
aside button.aktif{background:var(--hijau2);color:var(--hijau);font-weight:600}
aside button:focus-visible{outline:2px solid var(--hijau);outline-offset:1px}
aside button i{font-style:normal;font-family:var(--m);font-size:11px;color:var(--teks3);width:20px;flex:0 0 auto}
aside button.aktif i{color:var(--hijau)}

/* ---------------- isi ---------------- */
main{margin-left:240px;min-width:0;padding-block:0 56px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  max-width:1180px}
.kepala{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--latar);
  padding-block:20px 13px;margin-bottom:16px;border-bottom:1px solid var(--garis)}
.kepala h1{margin-bottom:0}
.eyebrow{font:600 10px/1 var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--hijau);margin-bottom:9px}
h1{font-size:clamp(1.35rem,3.1vw,1.85rem);line-height:1.14;margin:0 0 .4rem;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.lead{color:var(--teks2);max-width:70ch;margin:0 0 1.6rem;font-size:.93rem}
h2{font-size:1.05rem;margin:2rem 0 .7rem;font-weight:600}
h3{font-size:.95rem;margin:1.6rem 0 .5rem;font-weight:600}
p{margin:0 0 .8rem}
code{font-family:var(--m);font-size:.87em;background:var(--panel2);padding:.1em .35em;border-radius:3px}

/* ---------------- kartu persamaan ---------------- */
.kartu{background:var(--panel);border:1px solid var(--garis);border-radius:9px;margin-bottom:14px;overflow:hidden}
.kkepala{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:11px 14px;
  background:var(--panel2);border-bottom:1px solid var(--garis)}
.tag{font:700 10.5px/1 var(--m);color:var(--hijau);background:var(--hijau3);
  padding:5px 8px;border-radius:5px;letter-spacing:.03em;flex:0 0 auto}
.kkepala b{font-size:.92rem;font-weight:600;min-width:0}
.rumus{font-family:var(--m);font-size:clamp(.8rem,2.2vw,.96rem);font-weight:500;
  padding:15px 14px;overflow-x:auto;white-space:nowrap;color:#eaf6fa;
  background:linear-gradient(180deg,#0e1b21,#101e25);border-bottom:1px solid var(--garis)}
.rumus sub,.rumus sup{font-size:.72em}
/* pecahan bertingkat, penulisan matematis */
.frak{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
  line-height:1.2;margin:0 .22em;font-size:.94em}
.frak>span{padding:0 .36em;display:block}
.frak>span:first-child{border-bottom:1.3px solid currentColor;padding-bottom:.1em}
.frak>span:last-child{padding-top:.1em}
td .frak,.br .frak{font-size:.92em}
.sel4{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}
.sl{padding:12px 14px;border-top:1px solid var(--garis);border-right:1px solid var(--garis);min-width:0}
.sl h4{font:600 9.5px/1 var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--teks3);margin:0 0 7px}
.sl p{margin:0;font-size:.855rem;color:var(--teks)}
.hit{font-family:var(--m);font-size:.8rem;background:#0c171d;border:1px solid var(--garis);
  border-radius:5px;padding:8px 9px;margin-top:7px;white-space:normal;word-break:break-word;color:var(--hijau);line-height:1.7}

/* ---------------- nota ---------------- */
.nota{border-left:3px solid var(--hijau);background:var(--panel);padding:11px 14px;
  margin:14px 0;border-radius:0 7px 7px 0;font-size:.875rem}
.nota.awas{border-left-color:var(--kuning)}
.nota.bahaya{border-left-color:var(--merah)}
.nota b{display:block;font:600 9.5px/1 var(--m);letter-spacing:.14em;text-transform:uppercase;
  color:var(--teks3);margin-bottom:6px}

/* ---------------- tabel ---------------- */
.tb{overflow-x:auto;border:1px solid var(--garis);border-radius:9px;background:var(--panel);margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--garis);white-space:nowrap}
th{font:600 9.5px/1.3 var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--teks3);background:#0d1a20}
td.n{font-family:var(--m);font-variant-numeric:tabular-nums;text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#13232a}
tr.sorot td{background:var(--kuning2)}
tr.sorot:hover td{background:#4a3a16}

/* ---------------- ubin angka ---------------- */
.ubin{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:14px 0}
.ub{background:var(--panel);border:1px solid var(--garis);border-radius:9px;padding:13px 14px;min-width:0}
.ub em{display:block;font:600 9.5px/1.3 var(--m);letter-spacing:.11em;text-transform:uppercase;
  color:var(--teks3);font-style:normal;margin-bottom:7px}
.ub strong{font-family:var(--m);font-size:1.5rem;font-weight:400;font-variant-numeric:tabular-nums;
  display:block;letter-spacing:-.01em}
.ub small{display:block;color:var(--teks2);font-size:.76rem;margin-top:4px}

/* ---------------- bagan alir ---------------- */
.alirbungkus{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:8px}
.alirkolom{background:var(--panel);border:1px solid var(--garis);border-radius:9px;padding:14px;min-width:0}
.alirkolom h3{margin:0 0 10px;font:600 10px/1 var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--hijau)}
.alirgeser{overflow-x:auto}
svg.alir{width:100%;min-width:430px;height:auto;display:block}
.alir .t{font:500 11.5px var(--f);fill:var(--teks)}
.alir .t-kecil{font:500 10.5px var(--f);fill:var(--teks)}
.alir .t-pers{font:600 10px var(--m);fill:var(--hijau)}
.alir .t-label{font:600 10px var(--m);fill:#8fb0ba}
.legenda{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 0;font-size:.78rem;color:var(--teks2)}
.legenda span{display:flex;align-items:center;gap:7px}
.sw{width:15px;height:13px;border-radius:3px;border:1px solid var(--garis);flex:0 0 auto}

/* ---------------- iterasi ---------------- */
.iter{background:var(--panel);border:1px solid var(--garis);border-radius:9px;padding:14px;margin-bottom:12px}
.iterk{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lenc{font:700 10px/1 var(--m);padding:5px 8px;border-radius:5px;letter-spacing:.06em;flex:0 0 auto}
.lenc.ok{background:var(--hijau3);color:var(--hijau)}
.lenc.no{background:var(--merah2);color:var(--merah)}
.br{font-family:var(--m);font-size:.82rem;padding:6px 0;border-bottom:1px dashed var(--garis);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--teks2)}
.br:last-child{border-bottom:none}
.br b{color:var(--teks);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------------- latihan ---------------- */
.cip{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.cip button{font:600 11px/1 var(--m);padding:7px 11px;border-radius:999px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--garis);color:var(--teks2);letter-spacing:.03em}
.cip button:hover{border-color:var(--hijau);color:var(--teks)}
.cip button.aktif{background:var(--hijau2);border-color:var(--hijau);color:var(--hijau)}
.cip button:focus-visible{outline:2px solid var(--hijau);outline-offset:2px}

.soal{background:var(--panel);border:1px solid var(--garis);border-radius:11px;overflow:hidden}
.soalkepala{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--garis)}
.soalisi{padding:16px}
.pertanyaan{font-size:.95rem;margin-bottom:14px}
.diket{background:#0c171d;border:1px solid var(--garis);border-radius:7px;padding:11px 13px;margin-bottom:14px}
.diket div{font-family:var(--m);font-size:.84rem;display:flex;justify-content:space-between;gap:14px;
  padding:3px 0;color:var(--teks2);flex-wrap:wrap}
.diket div b{color:var(--hijau);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.jawabbaris{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.jawabbaris input{font-family:var(--m);font-size:1rem;padding:10px 12px;border-radius:7px;
  background:#0c171d;border:1px solid var(--garis);color:var(--teks);width:170px;min-width:0}
.jawabbaris input:focus{outline:2px solid var(--hijau);outline-offset:0;border-color:var(--hijau)}
.satuan{font-family:var(--m);font-size:.9rem;color:var(--teks2)}
button.aksi{font:600 12.5px var(--f);padding:10px 16px;border-radius:7px;cursor:pointer;
  background:var(--hijau);border:1px solid var(--hijau);color:#06201a}
button.aksi:hover{filter:brightness(1.08)}
button.aksi.sunyi{background:transparent;color:var(--teks2);border-color:var(--garis)}
button.aksi.sunyi:hover{color:var(--teks);border-color:var(--teks3);filter:none}
button.aksi:focus-visible{outline:2px solid var(--hijau);outline-offset:2px}
.umpan{margin-top:13px;padding:11px 13px;border-radius:7px;font-size:.875rem;display:none}
.umpan.tampil{display:block}
.umpan.benar{background:var(--hijau3);border:1px solid #1d5b4c;color:var(--hijau)}
.umpan.salah{background:var(--merah2);border:1px solid #5a2f2b;color:var(--merah)}
.langkah{margin-top:13px;display:none}
.langkah.tampil{display:block}
.langkah ol{margin:0;padding-left:20px}
.langkah li{font-family:var(--m);font-size:.82rem;color:var(--teks2);padding:4px 0}
.langkah li b{color:var(--teks)}
.skor{display:flex;gap:16px;font:600 11px var(--m);color:var(--teks2);letter-spacing:.04em;flex-wrap:wrap}
.skor b{color:var(--hijau);font-variant-numeric:tabular-nums}
.api{color:var(--kuning)}

.fin{color:var(--teks3);font-size:.8rem;margin-top:34px;border-top:1px solid var(--garis);padding-top:16px}

@media(max-width:820px){
  aside{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--garis);
    padding-right:max(14px,env(safe-area-inset-right,0px))}
  main{margin-left:0}
  .daftarmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px}
  .grup{display:none}
}
</style>

  function dari64(s){
    var r = atob(s), a = new Uint8Array(r.length);
    for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i);
    return a;

  function buka(frasa){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(frasa), 'PBKDF2', false, ['deriveKey'])
      .then(function(bahan){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:dari64(GARAM), iterations:PUTARAN, hash:'SHA-256' },
          bahan, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(kunci){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:dari64(IV) }, kunci, dari64(TEKS));
      })
      .then(function(buf){
        return JSON.parse(new TextDecoder().decode(buf));
      });
  }

    var frasa = inp.value;
    if (!frasa) { pesan.textContent = 'Frasa sandi belum diisi.'; return; }
    tb.disabled = true; tb.textContent = 'Membuka…'; pesan.textContent = '';
    buka(frasa).then(pasang).catch(function(){
      tb.disabled = false; tb.textContent = 'Buka panel';
      pesan.textContent = 'Frasa sandi salah.';
      inp.select();
    });
  });

  // buka sendiri bila masih dalam sesi peramban yang sama
  var simpan = null;
  try { simpan = sessionStorage.getItem('hc-kunci'); } catch(e){}
  if (simpan){ inp.value = simpan; buka(simpan).then(pasang).catch(function(){ inp.value=''; }); }
  else { inp.focus(); }
})();
</script>
